name: Publish extensions and GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.1.285'
        required: true
        type: string
      dry_run:
        description: 'Test and package only; do not publish anywhere'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  VSCE_PUBLISH_VERSION: '4.1.1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: Validate, test, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      artifact_id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - name: Validate tag format
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable version tag such as v0.1.285.' >&2
            exit 1
          fi
          if [[ "$DRY_RUN" != 'true' && "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo 'For publishing, run this workflow from the same release tag, not a branch.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate versions and record commit
        id: identity
        run: python3 .github/scripts/release-artifacts.py validate --tag "$RELEASE_TAG"
      - name: Test release validation
        run: python3 .github/scripts/test-release-artifacts.py
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Validate packages and record checksums
        run: python3 .github/scripts/release-artifacts.py record --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifacts
        with:
          name: release-vsix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/vscode-enhanced-git.vsix
            dist/vscode-enhanced-git-icon-theme.vsix
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Summarize build
        run: |
          echo "Built both VSIX packages for $RELEASE_TAG at $RELEASE_COMMIT." >> "$GITHUB_STEP_SUMMARY"
          echo 'A manual run with dry_run enabled stops after this build.' >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}

  publish:
    name: Publish bridge, then main extension
    needs: build
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify exact build artifacts
        run: python3 .github/scripts/release-artifacts.py verify --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      - name: Install OIDC-capable publishing CLI
        run: npm install --prefix "$RUNNER_TEMP/vsce-publish" --no-audit --no-fund --registry=https://registry.npmjs.org "@vscode/vsce@$VSCE_PUBLISH_VERSION"
      # Each invocation requests its own short-lived OIDC credential.
      # skip-duplicate allows retrying after one of the two packages succeeds.
      - name: Publish bridge to Marketplace
        run: '"$RUNNER_TEMP/vsce-publish/node_modules/.bin/vsce" publish --oidc --packagePath dist/vscode-enhanced-git-icon-theme.vsix --skip-duplicate'
      - name: Publish main extension to Marketplace
        run: '"$RUNNER_TEMP/vsce-publish/node_modules/.bin/vsce" publish --oidc --packagePath dist/vscode-enhanced-git.vsix --skip-duplicate'

  release:
    name: Create GitHub Release with both VSIX packages
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify exact build artifacts
        run: python3 .github/scripts/release-artifacts.py verify --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets"; then
            # Resume a partial release without overwriting already uploaded assets.
            for asset in vscode-enhanced-git-icon-theme.vsix vscode-enhanced-git.vsix; do
              if ! grep -Fxq "$asset" "$RUNNER_TEMP/release-assets"; then
                gh release upload "$RELEASE_TAG" "dist/$asset"
              fi
            done
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == 'true' ]]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" dist/vscode-enhanced-git-icon-theme.vsix dist/vscode-enhanced-git.vsix \
              --verify-tag --title "Enhanced Git for Visual Studio Code $RELEASE_TAG" --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
